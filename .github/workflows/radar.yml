name: Hamzeh DEX Radar
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '21 * * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  scan-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Validate dashboard structure
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          assert html.count("<script>") == 1
          assert html.count("</script>") == 1
          assert html.count("</html>") == 1
          assert html.strip().endswith("</script></body></html>")
          assert "async function load()" in html
          coin = Path("coin.html").read_text(encoding="utf-8")
          assert coin.count("<script>") == coin.count("</script>") == 1
          assert coin.count("</html>") == 1
          assert coin.strip().endswith("</script></body></html>")
          print("Dashboard HTML structure OK")
          PY
      - name: Restore BTC monitoring state
        uses: actions/cache/restore@v4
        with:
          path: state/btc_levels.json
          key: btc-levels-${{ github.run_id }}
          restore-keys: |
            btc-levels-
      - name: Scan markets
        run: python radar.py
      - name: Save BTC monitoring state
        if: success()
        uses: actions/cache/save@v4
        with:
          path: state/btc_levels.json
          key: btc-levels-${{ github.run_id }}
      - name: Build site
        run: |
          cp index.html output/index.html
          cp coin.html output/coin.html
          touch output/.nojekyll
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: output/
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
