name: PendarCrypto
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '21 * * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  scan-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Validate dashboard structure
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          assert html.count("<script>") == 1
          assert html.count("</script>") == 2
          assert '<script src="./site.js" defer></script>' in html
          assert html.count("</html>") == 1
          assert html.strip().endswith("</script></body></html>")
          assert "async function load()" in html
          coin = Path("coin.html").read_text(encoding="utf-8")
          assert coin.count("<script>") == 1 and coin.count("</script>") == 2
          assert '<script src="./site.js" defer></script>' in coin
          assert coin.count("</html>") == 1
          assert coin.strip().endswith("</script></body></html>")
          print("Dashboard HTML structure OK")
          PY
      - name: Validate dashboard JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          for page in ("index.html", "coin.html"):
              html = Path(page).read_text(encoding="utf-8")
              assert html.count("<script>") == 1, page
              assert html.count("</script>") == 2, page
              assert '<script src="./site.js" defer></script>' in html, page
              javascript = html.split("<script>", 1)[1].split("</script>", 1)[0]
              Path(page + ".check.cjs").write_text(javascript, encoding="utf-8")
          PY
          node --check index.html.check.cjs
          node --check coin.html.check.cjs
          node --check site.js
          python - <<'PY'
          from pathlib import Path
          html = Path("calculator.html").read_text(encoding="utf-8")
          assert '<script src="./site.js" defer></script>' in html
          assert 'href="./styles.css"' in html
          javascript = html.split("<script>",1)[1].split("</script>",1)[0]
          Path("calculator.check.cjs").write_text(javascript,encoding="utf-8")
          PY
          node --check calculator.check.cjs
      - name: Restore BTC monitoring state
        uses: actions/cache/restore@v4
        with:
          path: state/btc_levels.json
          key: btc-levels-${{ github.run_id }}
          restore-keys: |
            btc-levels-
      - name: Scan markets
        run: python radar.py
      - name: Save BTC monitoring state
        if: success()
        uses: actions/cache/save@v4
        with:
          path: state/btc_levels.json
          key: btc-levels-${{ github.run_id }}
      - name: Scan Iranian arbitrage (read-only)
        continue-on-error: true
        run: |
          python -m pip install 'mcp>=1,<3' iran-crypto-mcp
          timeout 150 python arbitrage_scan.py
      - name: Build site
        run: |
          cp index.html output/index.html
          cp coin.html output/coin.html
          cp arbitrage.html output/arbitrage.html
          cp arbitrage-detail.html output/arbitrage-detail.html
          cp guide.html output/guide.html
          cp calculator.html output/calculator.html
          cp styles.css output/styles.css
          cp site.js output/site.js
          if [ ! -f output/arbitrage.json ]; then echo '{"status":"unavailable","opportunities":[],"message":"Arbitrage scan failed","generated_at_utc":null}' > output/arbitrage.json; fi
          touch output/.nojekyll
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: output/
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
