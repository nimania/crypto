name: Fast Hourly Technical Monitor
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fast-hourly-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Scan full current published watchlist
        run: python fast_hourly.py
      - name: Publish hourly data branch only
        run: |
          cp hourly.json /tmp/crypto-hourly.json
          git fetch origin hourly-data
          git checkout hourly-data
          cp /tmp/crypto-hourly.json hourly.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hourly.json
          if ! git diff --cached --quiet; then
            git commit -m "Update 15-minute hourly technical watchlist"
            git push origin HEAD:hourly-data
          fi
